name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q 'حل_الألغاز_AdMob_Rewarded_مستقل_معدل.zip' -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        working-directory: project/PuzzleAdMobRewardedClean
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-admob-apk
          path: project/PuzzleAdMobRewardedClean/app/build/outputs/apk/debug/*.apk
